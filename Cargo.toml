[package]
name = "madeline-crypto"
version = "0.6.0"
edition = "2021"
rust-version = "1.92"
authors = ["Alexander Pankratov <s.pankratoff@gmail.com>", "Daniil Gentili <daniil@daniil.it>"]
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ext-php-rs = { version = "=0.16.3", optional = true }
php-tokio = { version = "=0.2.1", optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync"] }
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "=0.3.2"
zeroize = { version = "=1.9.1", features = ["derive"] }
libc = "=0.2.191"
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = ["php-extension", "const-widths"]
php-extension = ["dep:ext-php-rs", "dep:php-tokio"]
# Specialize widths 1–32; larger batches use the dynamic kernel.
const-widths = []
# Link a static OpenSSL built from source (needs perl and make, or perl and nmake on Windows): the
# prebuilt PIE binaries, which can't rely on the libssl of the system they land on.
vendored-openssl = ["openssl/vendored"]

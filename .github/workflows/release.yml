name: Release binaries

# Builds the pre-packaged binaries PIE downloads (named as PIE expects, see tests/package.sh), tests each
# one, and attaches them to the release. Without a matching binary, PIE builds from source.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}, PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built on Ubuntu 22.04: they need glibc 2.35 or later.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2022]
        php: ["8.2", "8.3", "8.4", "8.5"]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: MSVC toolset of the PHP build (Windows)
        # PHP refuses extensions linked with a newer toolset than its own: 14.29 (VS16) for PHP 8.2/8.3,
        # 14.4x (VS17) for 8.4/8.5, as php-windows-builder does.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ (matrix.php == '8.2' || matrix.php == '8.3') && '14.29' || '14.4' }}
      - name: Native dependencies
        shell: bash
        run: tests/ci-deps.sh
      - name: Build (static OpenSSL)
        shell: bash
        run: cargo build --release --locked --features vendored-openssl
      - name: Test the binary
        shell: bash
        run: |
          composer install --no-interaction --no-progress
          php -d "extension=$(tests/library-path.sh)" vendor/bin/phpunit
      - name: Package
        id: package
        shell: bash
        run: tests/package.sh "$TAG"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ steps.package.outputs.assets }} --clobber

  # What users run: `pie install` of this release from Packagist, on every platform with a binary. PIE must
  # pick the attached binary (not build from source: these runners have no Rust toolchain on PATH for it),
  # and the installed extension must pass the test suite.
  pie-install:
    name: pie install (${{ matrix.os }}, PHP ${{ matrix.php }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        php: ["8.2", "8.5"]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, pie
      - name: Install the release with PIE
        shell: bash
        run: |
          # Packagist picks the tag up from GitHub's webhook: retry for a few minutes.
          tests/pie-writable.sh
          for i in $(seq 1 20); do
            if pie install --skip-enable-extension "danog/madelinecrypto:$TAG" 2>&1 | tee pie.log; then break; fi
            sleep 30
          done
          grep -q 'Found prebuilt archive' pie.log || { echo "PIE didn't use the prebuilt binary"; exit 1; }
          php -d extension=madeline_crypto -r 'echo phpversion("madeline_crypto"), "\n";' | grep -qx "$TAG"
      - name: Test the installed extension
        shell: bash
        run: |
          composer install --no-interaction --no-progress
          php -d extension=madeline_crypto vendor/bin/phpunit

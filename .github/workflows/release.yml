name: Release binaries

# Builds the pre-packaged binaries PIE downloads (named as PIE expects, see tests/package.sh), tests each
# one, and attaches them to the release. Without a matching binary, PIE builds from source.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}, PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built on Ubuntu 22.04: they need glibc 2.35 or later.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2025]
        php: ["8.2", "8.3", "8.4", "8.5"]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Native dependencies
        shell: bash
        run: tests/ci-deps.sh
      - name: Build (static OpenSSL)
        shell: bash
        run: cargo build --release --locked --features vendored-openssl
      - name: Test the binary
        shell: bash
        run: |
          composer install --no-interaction --no-progress
          php -d "extension=$(tests/library-path.sh)" vendor/bin/phpunit
      - name: Package
        id: package
        shell: bash
        run: tests/package.sh "$TAG"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ steps.package.outputs.assets }} --clobber
